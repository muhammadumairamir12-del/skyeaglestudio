<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Admin | SkyEagle Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14213d;--mute:#5b6b83;--line:#dbe3ec;--accent:#1d6fe8;--warn:#b7791f;--ok:#15803d;--bad:#c53030}
*{box-sizing:border-box;margin:0}
body{font-family:Manrope,system-ui,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
button{font:inherit;cursor:pointer;border:0;border-radius:8px;padding:9px 14px;font-weight:700;background:var(--accent);color:#fff}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.ok{background:var(--ok)} button.bad{background:var(--bad)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid #9cc3ff;outline-offset:2px}
input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.box{background:var(--card);padding:32px;border-radius:14px;width:100%;max-width:380px;border:1px solid var(--line)}
.box h1{font-size:22px;margin-bottom:4px}.box p{color:var(--mute);margin-bottom:20px;font-size:14px}
.box label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px}
.box button{width:100%;margin-top:20px;padding:12px}
#err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}
#app{display:none}
header{background:var(--ink);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
header b{font-size:18px}header span{opacity:.7;font-size:13px;margin-right:12px}
header button{background:#ffffff1f}
main{max-width:980px;margin:0 auto;padding:24px 16px 60px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px}
.stat b{font-size:28px;display:block}.stat small{color:var(--mute);font-weight:500}
.tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:18px;overflow-x:auto}
.tabs button{background:none;color:var(--mute);border-radius:8px 8px 0 0;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent)}
.item{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:12px}
.item.new{border-left:4px solid var(--accent)}
.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.top b{font-size:16px}.time{color:var(--mute);font-size:12px}
.meta{font-size:13px;color:var(--mute);margin-bottom:10px;display:flex;gap:14px;flex-wrap:wrap}
.meta a{color:var(--accent);font-weight:700;text-decoration:none}
.msg{white-space:pre-wrap;word-break:break-word;line-height:1.55;margin-bottom:14px}
.act{display:flex;gap:8px;flex-wrap:wrap}.act button,.act a{font-size:13px}
.act a{padding:9px 14px;border-radius:8px;background:#25d366;color:#fff;font-weight:700;text-decoration:none}
.stars{color:#e0a100;letter-spacing:2px}
.empty{text-align:center;color:var(--mute);padding:40px 0}
.badge{background:var(--accent);color:#fff;border-radius:99px;font-size:11px;padding:2px 8px;margin-left:6px}
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none}
#toast.show{opacity:1}
</style>
</head>
<body>

<section id="login">
  <form class="box" id="loginForm">
    <h1>SkyEagle Studio</h1>
    <p>Sign in to the admin panel.</p>
    <label for="em">Email</label><input id="em" type="email" autocomplete="username" required>
    <label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password" required>
    <button type="submit">Login</button>
    <div id="err" role="alert"></div>
  </form>
</section>

<div id="app">
  <header><b>SkyEagle Studio Admin</b><div><span id="who"></span><button id="out">Logout</button></div></header>
  <main>
    <div class="stats">
      <div class="stat"><b id="s1">0</b><small>New queries</small></div>
      <div class="stat"><b id="s2">0</b><small>Total queries</small></div>
      <div class="stat"><b id="s3">0</b><small>Pending reviews</small></div>
      <div class="stat"><b id="s4">0</b><small>Live reviews</small></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-t="queries" class="on">Queries <span class="badge" id="b1" hidden></span></button>
      <button data-t="pending">Pending reviews <span class="badge" id="b2" hidden></span></button>
      <button data-t="approved">Approved reviews</button>
    </div>
    <div id="list"></div>
  </main>
</div>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getDatabase, ref, onValue, update, remove, set } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyB0LwjtjOGib10acfQNTxkhllofP1Tenus",
  authDomain: "skyeaglestudio-45886.firebaseapp.com",
  databaseURL: "https://skyeaglestudio-45886-default-rtdb.firebaseio.com",
  projectId: "skyeaglestudio-45886",
  storageBucket: "skyeaglestudio-45886.firebasestorage.app",
  messagingSenderId: "300452551069",
  appId: "1:300452551069:web:41c0bce1c400569eb17774"
});
const auth = getAuth(app), db = getDatabase(app);
const $ = id => document.getElementById(id);
const data = { queries: {}, pending: {}, approved: {} };
const paths = { queries: "queries", pending: "reviews_pending", approved: "reviews_approved" };
let tab = "queries", unsubs = [];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
const fmt = t => t ? new Date(t).toLocaleString("en-GB", { dateStyle: "medium", timeStyle: "short" }) : "";
const toast = m => { const t = $("toast"); t.textContent = m; t.className = "show"; setTimeout(() => t.className = "", 2200); };
const rows = o => Object.entries(o || {}).map(([id, v]) => ({ id, ...v })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

$("loginForm").addEventListener("submit", async e => {
  e.preventDefault(); $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("em").value.trim(), $("pw").value); }
  catch { $("err").textContent = "Incorrect email or password. Please try again."; }
});
$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  unsubs.forEach(u => u()); unsubs = [];
  $("login").style.display = user ? "none" : "grid";
  $("app").style.display = user ? "block" : "none";
  if (!user) return;
  $("who").textContent = user.email;
  for (const k in paths) {
    unsubs.push(onValue(ref(db, paths[k]), s => { data[k] = s.val() || {}; render(); },
      () => toast("Could not load data. Check database rules.")));
  }
});

$("tabs").onclick = e => {
  const b = e.target.closest("button[data-t]"); if (!b) return;
  tab = b.dataset.t;
  document.querySelectorAll("#tabs button").forEach(x => x.classList.toggle("on", x === b));
  render();
};

function render() {
  const q = rows(data.queries), p = rows(data.pending), a = rows(data.approved);
  const unread = q.filter(x => !x.read).length;
  $("s1").textContent = unread; $("s2").textContent = q.length; $("s3").textContent = p.length; $("s4").textContent = a.length;
  $("b1").hidden = !unread; $("b1").textContent = unread;
  $("b2").hidden = !p.length; $("b2").textContent = p.length;
  const list = tab === "queries" ? q : tab === "pending" ? p : a;
  if (!list.length) {
    $("list").innerHTML = `<div class="empty">${tab === "queries" ? "No queries yet." : tab === "pending" ? "No reviews waiting for approval." : "No live reviews yet."}</div>`;
    return;
  }
  $("list").innerHTML = list.map(tab === "queries" ? qCard : rCard).join("");
}

const qCard = x => {
  const num = String(x.phone || "").replace(/\D/g, "");
  return `<div class="item ${x.read ? "" : "new"}">
  <div class="top"><b>${esc(x.name)}</b><span class="time">${fmt(x.createdAt)}</span></div>
  <div class="meta">${x.email ? `<a href="mailto:${esc(x.email)}">${esc(x.email)}</a>` : ""}${x.phone ? `<span>${esc(x.phone)}</span>` : ""}${x.service ? `<span>Service: ${esc(x.service)}</span>` : ""}</div>
  <div class="msg">${esc(x.message)}</div>
  <div class="act">
    ${num ? `<a href="https://wa.me/${num}" target="_blank" rel="noopener">Reply on WhatsApp</a>` : ""}
    ${x.email ? `<a href="mailto:${esc(x.email)}" style="background:var(--accent)">Reply by email</a>` : ""}
    ${x.read ? "" : `<button class="ghost" data-a="read" data-id="${x.id}">Mark as read</button>`}
    <button class="bad" data-a="del-q" data-id="${x.id}">Delete</button>
  </div></div>`;
};

const rCard = x => `<div class="item">
  <div class="top"><b>${esc(x.name)}</b><span class="time">${fmt(x.createdAt)}</span></div>
  <div class="stars">${"★".repeat(Math.min(5, +x.rating || 0))}${"☆".repeat(5 - Math.min(5, +x.rating || 0))}</div>
  <div class="msg" style="margin-top:8px">${esc(x.message)}</div>
  <div class="act">
    ${tab === "pending" ? `<button class="ok" data-a="approve" data-id="${x.id}">Approve</button><button class="bad" data-a="reject" data-id="${x.id}">Reject</button>`
      : `<button class="ghost" data-a="unpublish" data-id="${x.id}">Remove from website</button><button class="bad" data-a="del-r" data-id="${x.id}">Delete</button>`}
  </div></div>`;

$("list").onclick = async e => {
  const b = e.target.closest("button[data-a]"); if (!b) return;
  const id = b.dataset.id, act = b.dataset.a;
  try {
    if (act === "read") await update(ref(db, `queries/${id}`), { read: true });
    else if (act === "del-q" && confirm("Delete this query?")) await remove(ref(db, `queries/${id}`));
    else if (act === "approve") {
      const { id: _i, ...r } = data.pending[id] ? { id, ...data.pending[id] } : {};
      await set(ref(db, `reviews_approved/${id}`), { ...r, approvedAt: Date.now() });
      await remove(ref(db, `reviews_pending/${id}`)); toast("Review is now live on the website");
    }
    else if (act === "reject" && confirm("Reject this review?")) await remove(ref(db, `reviews_pending/${id}`));
    else if (act === "unpublish") {
      await set(ref(db, `reviews_pending/${id}`), data.approved[id]);
      await remove(ref(db, `reviews_approved/${id}`)); toast("Review removed from the website");
    }
    else if (act === "del-r" && confirm("Permanently delete this review?")) await remove(ref(db, `reviews_approved/${id}`));
  } catch { toast("Action failed. Check database rules."); }
};
</script>
</body>
</html>
